<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder mockup of the complete GLP-1 Success Blueprint system: the main guide plus ten bonus guides">
  <defs>
    <filter id="stack-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#26301c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- fanned bonus guides, back to front -->
  <g transform="rotate(-16 400 480)"><rect x="230" y="260" width="230" height="300" rx="12" fill="#E1DBCE"/></g>
  <g transform="rotate(-9 400 480)"><rect x="240" y="250" width="230" height="300" rx="12" fill="#EEF1E7"/></g>
  <g transform="rotate(-2 400 480)"><rect x="250" y="240" width="230" height="300" rx="12" fill="#F2D6C4"/></g>
  <g transform="rotate(5 400 480)"><rect x="260" y="245" width="230" height="300" rx="12" fill="#FCFBF8" stroke="#E5E1D8" stroke-width="2"/></g>
  <g transform="rotate(12 400 480)"><rect x="270" y="255" width="230" height="300" rx="12" fill="#E1DBCE"/></g>
  <g transform="rotate(19 400 480)"><rect x="280" y="265" width="230" height="300" rx="12" fill="#EEF1E7"/></g>

  <!-- main Blueprint cover, centered, largest -->
  <g filter="url(#stack-shadow)">
    <rect x="300" y="150" width="280" height="380" rx="16" fill="#344426"/>
    <text x="440" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C9D1B8" letter-spacing="2">THE</text>
    <text x="440" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#FFFFFF" font-weight="600">GLP-1 Success</text>
    <text x="440" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#FFFFFF" font-weight="600">Blueprint&#8482;</text>
    <rect x="360" y="360" width="160" height="3" fill="#7C8B33"/>
    <text x="440" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E1DBCE" letter-spacing="1">4-PHASE SYSTEM</text>
    <text x="440" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8F995E">+ 10 BONUS GUIDES</text>
  </g>
</svg>
